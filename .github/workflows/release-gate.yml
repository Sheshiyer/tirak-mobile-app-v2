name: Tirak mobile release gate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run release:verify-contracts
      - run: npm run release:verify-phase1-scaffolds
      - run: npm run release:verify-mobile
        env:
          EXPO_PUBLIC_API_URL: https://release-gate.invalid
      - run: npm run release:verify-mobile:negative

